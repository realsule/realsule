# Serves the built static site and, critically, falls back to index.html
# for any path nginx doesn't have a file for. This app uses React Router
# with real URL paths (/admin, /admin/login, /admin/projects, etc.) --
# without this fallback, refreshing the browser on any of those routes
# would hit nginx directly and 404, since no such file exists on disk.
server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Static assets: served with a long cache lifetime since Vite
    # fingerprints filenames (index-<hash>.js) -- a new deploy produces
    # new filenames, so this can be cached aggressively and safely.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Everything else: try the real file/directory first, then fall back
    # to index.html so client-side routing (React Router) can take over.
    location / {
        try_files $uri $uri/ /index.html;
    }

    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;
}
